<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Food Atlas</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Custom styles to match the theme */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212; /* Dark background from the image */
            overflow: hidden; /* Hide overflow from blurred shapes */
        }

        /* Recreating the subtle colored blobs from the homepage background */
        .blur-blob {
            position: absolute;
            filter: blur(100px);
            opacity: 0.15;
            border-radius: 9999px;
            z-index: 0;
        }
    </style>
</head>
<body class="relative text-gray-200">

    <!-- Background blurred blobs -->
    <div class="blur-blob w-96 h-96 bg-yellow-500 -top-20 -left-20"></div>
    <div class="blur-blob w-96 h-96 bg-green-500 -bottom-20 -right-20"></div>
    <div class="blur-blob w-72 h-72 bg-orange-400 bottom-24 left-1/4"></div>


    <div class="relative min-h-screen flex items-center justify-center p-4 z-10">
        <!-- Login Card -->
        <div class="w-full max-w-md bg-gray-900/60 backdrop-blur-lg border border-gray-700/50 rounded-2xl shadow-2xl p-8">
            
            <!-- Header with Logo and Title -->
            <div class="flex flex-col items-center mb-6">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 bg-amber-500 rounded-full flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-900" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </div>
                    <span class="text-2xl font-bold text-white">Food Atlas</span>
                </div>
                <h2 class="text-2xl font-bold text-gray-100">Welcome Back!</h2>
                <p class="text-gray-400 mt-1">Sign in to continue your culinary journey.</p>
            </div>

            <!-- Login Form -->
            <form action="#" method="POST">
                <div class="space-y-6">
                    <!-- Email Input -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-300">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            placeholder="you@example.com"
                            class="mt-1 block w-full bg-gray-800/80 border border-gray-600 rounded-lg shadow-sm py-3 px-4 text-white focus:outline-none focus:ring-2 focus:ring-amber-500 transition"
                            required>
                    </div>

                    <!-- Password Input -->
                    <div>
                        <div class="flex justify-between items-center">
                            <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
                            <a href="#" class="text-sm text-amber-500 hover:text-amber-400 transition">Forgot password?</a>
                        </div>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="••••••••"
                            class="mt-1 block w-full bg-gray-800/80 border border-gray-600 rounded-lg shadow-sm py-3 px-4 text-white focus:outline-none focus:ring-2 focus:ring-amber-500 transition"
                            required>
                    </div>

                    <!-- Submit Button -->
                    <div>
                        <button 
                            type="submit" 
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-lg font-bold text-gray-900 bg-amber-500 hover:bg-amber-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-amber-500 transition-transform transform hover:scale-105">
                            Log In
                        </button>
                    </div>
                </div>
            </form>

            <!-- Sign Up Link -->
            <p class="mt-8 text-center text-sm text-gray-400">
                Don't have an account? 
                <a href="#" class="font-medium text-amber-500 hover:text-amber-400 transition">Sign up</a>
            </p>
        </div>
    </div>

</body>
</html>

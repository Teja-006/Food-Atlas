<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Hyderabad Restaurants Map</title>
        <style>
            :root {
                --primary-color: #FFA500;
                --secondary-color: #FF8C00;
                --accent-color: #FFD700;
                --bg-dark: #1a1a1a;
                --bg-darker: #0d0d0d;
                --text-light: #ffffff;
                --text-gray: #cccccc;
                --shadow-light: rgba(255, 165, 0, 0.3);
                --shadow-dark: rgba(0, 0, 0, 0.5);
                --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            /* Global Styles */
            * {
                box-sizing: border-box;
            }

            body {
                font-family: var(--font-sans);
                margin: 0;
                background: var(--bg-dark);
                color: var(--text-light);
                line-height: 1.6;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                padding: 40px 20px;
            }

            a {
                color: var(--primary-color);
                text-decoration: none;
                transition: color 0.3s ease;
            }

            a:hover,
            a:focus {
                color: var(--accent-color);
                outline: none;
            }

            /* Page Title */
            .page-title {
                text-align: center;
                font-size: 2.5rem;
                font-weight: 700;
                color: var(--text-light);
                margin-bottom: 40px;
                letter-spacing: 1px;
            }

            /* Map container */
            .map-container {
                max-width: 1400px;
                margin: 0 auto;
                height: 600px;
                border-radius: 16px;
                overflow: hidden;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
                border: 2px solid rgba(255, 165, 0, 0.3);
            }

            #map {
                width: 100%;
                height: 100%;
                border: none;
            }

            /* Mapbox popup styles */
            .mapboxgl-popup {
                max-width: 300px;
                font-family: var(--font-sans);
                font-size: 0.9rem;
            }

            .mapboxgl-popup-content {
                padding: 18px 24px;
                background-color: var(--bg-darker);
                color: var(--text-light);
                border-radius: 12px;
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
                border: 2px solid var(--primary-color);
            }

            .mapboxgl-popup-content h4 {
                margin: 0 0 12px;
                font-weight: 700;
                color: var(--primary-color);
                font-size: 1.1rem;
            }

            .mapboxgl-popup-content p {
                margin: 6px 0;
                color: var(--text-gray);
            }

            .mapboxgl-popup-content a {
                color: var(--primary-color);
                font-weight: 600;
                display: inline-block;
                margin-top: 8px;
            }

            .mapboxgl-popup-content a:hover {
                color: var(--accent-color);
            }

            .mapboxgl-popup-close-button {
                color: var(--text-light);
                font-size: 20px;
                padding: 5px 10px;
            }

            .mapboxgl-popup-close-button:hover {
                background-color: var(--primary-color);
                color: var(--bg-darker);
            }

            .mapboxgl-popup-tip {
                border-top-color: var(--bg-darker) !important;
                border-bottom-color: var(--bg-darker) !important;
            }

            /* Responsive */
            @media (max-width: 768px) {
                body {
                    padding: 30px 15px;
                }
                .page-title {
                    font-size: 2rem;
                    margin-bottom: 30px;
                }
                .map-container {
                    height: 500px;
                }
            }

            @media (max-width: 480px) {
                body {
                    padding: 20px 10px;
                }
                .page-title {
                    font-size: 1.6rem;
                    margin-bottom: 25px;
                }
                .map-container {
                    height: 400px;
                    border-radius: 12px;
                }
            }
        </style>
        <!-- Mapbox CSS -->
        <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    </head>
    <body>
        <h1 class="page-title">Explore Food Locations</h1>

        <div class="map-container" aria-label="Map showing restaurants in Hyderabad">
            <div id="map"></div>
        </div>

        <!-- Mapbox JS -->
        <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
        <script>
            // Your Mapbox access token
            mapboxgl.accessToken = 'pk.eyJ1IjoiYXNoaXNoZzIyMDkiLCJhIjoiY21hYzdkcjd4MDA2dTJsc2RveHkzMjFhMSJ9.zTrg-kKSZW1UAmvzEvOOCQ';

            // Initialize the map
            const map = new mapboxgl.Map({
                container: "map",
                style: "mapbox://styles/mapbox/streets-v12",
                center: [78.4867, 17.3850], // Hyderabad coordinates
                zoom: 11
            });

            // Add navigation controls
            map.addControl(new mapboxgl.NavigationControl(), 'top-right');

            // Load data and add markers
            map.on('load', async () => {
                try {
                    // Fetch restaurant data
                    const response = await fetch('/api/restaurants');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const restaurantsFromDB = await response.json();
                    console.log('Successfully fetched restaurants:', restaurantsFromDB);

                    // Add markers for each restaurant
                    restaurantsFromDB.forEach(restaurant => {
                        if (restaurant.lng && restaurant.lat) {
                            // Create popup content
                            const popupHTML = `
                                <h4>${restaurant.name}</h4>
                                <p><strong>Cuisine:</strong> ${restaurant.cuisine || 'Not specified'}</p>
                                <p><strong>Rating:</strong> ${restaurant.rating || 'N/A'} ⭐</p>
                                <p><strong>Address:</strong> ${restaurant.address || 'Not available'}</p>
                            `;

                            // Create and add marker with popup
                            const popup = new mapboxgl.Popup({ offset: 25 }).setHTML(popupHTML);
                            new mapboxgl.Marker({ color: '#FFA500' })
                                .setLngLat([restaurant.lng, restaurant.lat])
                                .setPopup(popup)
                                .addTo(map);
                        }
                    });
                } catch (error) {
                    console.error("Error loading restaurant data:", error);
                    alert("Could not load restaurant data. Please ensure the backend server is running and accessible.");
                }
            });
        </script>
    </body>
</html>

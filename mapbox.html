<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hyderabad Restaurants & Map</title>
<style>
  /* ======= Refined Internal CSS ======= */

  /* Root variables for consistent colors */
  :root {
    --primary-color: #1abc9c;
    --secondary-color: #16a085;
    --accent-color: #e67e22;
    --bg-light: #f4f7f6;
    --text-dark: #2c3e50;
    --shadow-light: rgba(26, 188, 156, 0.15);
    --shadow-dark: rgba(44, 62, 80, 0.1);
    --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  /* Global Styles */
  * {
    box-sizing: border-box;
  }

  body {
    font-family: var(--font-sans);
    margin: 0;
    background: var(--bg-light);
    color: var(--text-dark);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  a {
    color: var(--primary-color);
    text-decoration: none;
    transition: color 0.3s ease;
  }
  a:hover,
  a:focus {
    color: var(--accent-color);
    outline: none;
  }

  header {
    background-color: var(--secondary-color);
    padding: 25px 30px;
    color: white;
    font-weight: 700;
    font-size: 2rem;
    text-align: center;
    letter-spacing: 1.2px;
    position: relative;
  }

  /* Back button in header */
  .back-button {
    position: absolute;
    top: 50%;
    left: 25px;
    transform: translateY(-50%);
    background: white;
    color: var(--secondary-color);
    border: none;
    padding: 8px 16px;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 0 4px 10px var(--shadow-light);
    transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
    user-select: none;
  }
  .back-button:hover,
  .back-button:focus {
    background-color: var(--accent-color);
    color: white;
    box-shadow: 0 6px 15px rgba(230, 126, 34, 0.5);
    outline: none;
  }

  section {
    max-width: 1200px;
    margin: 40px auto 60px;
    padding: 0 30px;
  }

  h2.section-title {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--secondary-color);
    margin-bottom: 20px;
    letter-spacing: 0.5px;
    border-left: 6px solid var(--primary-color);
    padding-left: 14px;
  }

  /* Categories and Featured restaurants containers */
  .categories,
  .featured-restaurants {
    display: flex;
    overflow-x: auto;
    gap: 24px;
    padding-bottom: 8px;
    scroll-padding: 0 10px;
  }

  /* Hide scrollbar but allow scrolling */
  .categories::-webkit-scrollbar,
  .featured-restaurants::-webkit-scrollbar {
    height: 8px;
  }
  .categories::-webkit-scrollbar-track,
  .featured-restaurants::-webkit-scrollbar-track {
    background: transparent;
  }
  .categories::-webkit-scrollbar-thumb,
  .featured-restaurants::-webkit-scrollbar-thumb {
    background-color: var(--primary-color);
    border-radius: 10px;
  }

  /* Category & Restaurant cards as buttons for accessibility */
  .category-card,
  .restaurant-card {
    flex: 0 0 180px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 14px var(--shadow-dark);
    padding: 18px 20px;
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--text-dark);
    cursor: pointer;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    transition:
      transform 0.3s ease,
      box-shadow 0.3s ease,
      background-color 0.3s ease,
      color 0.3s ease;
    border: 2px solid transparent;
  }
  .category-card:hover,
  .restaurant-card:hover,
  .category-card:focus,
  .restaurant-card:focus {
    transform: translateY(-8px);
    box-shadow: 0 12px 28px var(--shadow-dark);
    outline: none;
    background-color: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
  }

  /* Selected category styling */
  .category-card.selected {
    background-color: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
    box-shadow: 0 14px 32px rgba(26, 188, 156, 0.7);
  }

  /* Featured restaurants links */
  .restaurant-card {
    text-decoration: none;
  }

  /* Hero Button */
  .hero-button {
    background-color: var(--primary-color);
    color: white;
    border: none;
    padding: 14px 32px;
    font-size: 1.2rem;
    font-weight: 700;
    border-radius: 40px;
    cursor: pointer;
    display: block;
    margin: 20px auto 50px;
    max-width: 280px;
    text-align: center;
    transition: background-color 0.4s ease, box-shadow 0.4s ease;
    user-select: none;
    box-shadow: 0 6px 20px rgba(26, 188, 156, 0.4);
  }
  .hero-button:hover,
  .hero-button:focus {
    background-color: var(--accent-color);
    box-shadow: 0 8px 28px rgba(230, 126, 34, 0.7);
    outline: none;
  }

  /* Map container */
  .map-container {
    max-width: 1200px;
    height: 480px;
    margin: 0 auto 60px;
    padding: 0 30px;
    border-radius: 14px;
    border: 3px solid var(--primary-color);
    box-shadow: 0 12px 36px var(--shadow-light);
    transition: box-shadow 0.4s ease;
  }
  .map-container:hover {
    box-shadow: 0 20px 48px rgba(26, 188, 156, 0.7);
  }

  #map {
    width: 100%;
    height: 100%;
    border-radius: 12px;
  }

  /* Mapbox popup styles */
  .mapboxgl-popup {
    max-width: 280px;
    font-family: var(--font-sans);
    font-size: 0.9rem;
    color: var(--text-dark);
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
  }
  .mapboxgl-popup-content {
    padding: 16px 22px;
  }
  .mapboxgl-popup-content h4 {
    margin: 0 0 10px;
    font-weight: 700;
    color: var(--secondary-color);
  }
  .mapboxgl-popup-content p {
    margin: 0;
    color: #555;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .categories,
    .featured-restaurants {
      flex-wrap: nowrap;
    }
    .category-card,
    .restaurant-card {
      flex: 0 0 140px;
      font-size: 0.9rem;
      padding: 14px 18px;
    }
    section {
      padding: 0 20px;
      margin: 30px auto 50px;
    }
    .map-container {
      padding: 0 20px;
      height: 400px;
    }
  }

  @media (max-width: 480px) {
    header {
      font-size: 1.5rem;
      padding: 20px 15px;
    }
    .back-button {
      left: 15px;
      padding: 6px 14px;
      font-size: 0.8rem;
    }
    section {
      margin: 25px 15px 40px;
      padding: 0 15px;
    }
    .categories,
    .featured-restaurants {
      gap: 16px;
    }
    .category-card,
    .restaurant-card {
      flex: 0 0 90vw !important;
      font-size: 1rem;
      padding: 16px 20px;
    }
    .map-container {
      padding: 0 15px;
      height: 320px;
    }
    .hero-button {
      max-width: 220px;
      font-size: 1rem;
    }
  }
</style>
<!-- Mapbox CSS -->
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
</head>
<body>

<header>
  Hyderabad Food Explorer
  <button class="back-button" onclick="history.back()" aria-label="Go back to previous page">← Back</button>
</header>

<section>
  <h2 class="section-title">Categories</h2>
  <div class="categories" role="list">
    <a href="#" data-category="All" class="category-card selected" role="listitem" tabindex="0">All</a>
    <a href="#" data-category="Biryani" class="category-card" role="listitem" tabindex="0">Biryani</a>
    <a href="#" data-category="South Indian" class="category-card" role="listitem" tabindex="0">South Indian</a>
    <a href="#" data-category="Seafood" class="category-card" role="listitem" tabindex="0">Seafood</a>
    <a href="#" data-category="Barbecue" class="category-card" role="listitem" tabindex="0">Barbecue</a>
    <a href="#" data-category="Italian" class="category-card" role="listitem" tabindex="0">Italian</a>
    <a href="#" data-category="Mediterranean" class="category-card" role="listitem" tabindex="0">Mediterranean</a>
    <a href="#" data-category="Andhra" class="category-card" role="listitem" tabindex="0">Andhra</a>
    <a href="#" data-category="Mughlai" class="category-card" role="listitem" tabindex="0">Mughlai</a>
  </div>
</section>

<section>
  <h2 class="section-title">Featured Restaurants</h2>
  <div class="featured-restaurants" role="list">
    <a href="#" class="restaurant-card" tabindex="0" aria-label="Kebab Studio, Cuisine: Barbecue, Rating 4.5 stars">Kebab Studio</a>
    <a href="#" class="restaurant-card" tabindex="0" aria-label="Paradise Biryani, Cuisine: Biryani, Rating 4.6 stars">Paradise Biryani</a>
    <a href="#" class="restaurant-card" tabindex="0" aria-label="Chutneys, Cuisine: South Indian, Rating 4.3 stars">Chutneys</a>
    <a href="#" class="restaurant-card" tabindex="0" aria-label="Ohri's Jiva, Cuisine: Mediterranean, Rating 4.2 stars">Ohri's Jiva</a>
    <a href="#" class="restaurant-card" tabindex="0" aria-label="Bawarchi, Cuisine: Biryani, Rating 4.1 stars">Bawarchi</a>
  </div>
</section>

<div class="map-container" aria-label="Map showing restaurants in Hyderabad">
  <div id="map"></div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<script>
  mapboxgl.accessToken = 'pk.eyJ1IjoiYXNoaXNoZzIyMDkiLCJhIjoiY21hYzdkcjd4MDA2dTJsc2RveHkzMjFhMSJ9.zTrg-kKSZW1UAmvzEvOOCQ';

  const restaurants = [
    {
      name: "Paradise Biryani",
      category: "Biryani",
      coords: [78.4744, 17.4399],
      cuisine: "Biryani",
      rating: 4.6,
      address: "Shop 1, RTC Cross Roads, Hyderabad",
      url: "#"
    },
    {
      name: "Bawarchi",
      category: "Biryani",
      coords: [78.4747, 17.4146],
      cuisine: "Biryani",
      rating: 4.1,
      address: "Hill Fort Rd, Hyderabad",
      url: "#"
    },
    {
      name: "Chutneys",
      category: "South Indian",
      coords: [78.4867, 17.4297],
      cuisine: "South Indian",
      rating: 4.3,
      address: "Banjara Hills, Hyderabad",
      url: "#"
    },
    {
      name: "Ohri's Jiva",
      category: "Mediterranean",
      coords: [78.4833, 17.4320],
      cuisine: "Mediterranean",
      rating: 4.2,
      address: "Road No. 12, Banjara Hills",
      url: "#"
    },
    {
      name: "Kebab Studio",
      category: "Barbecue",
      coords: [78.4807, 17.4260],
      cuisine: "Barbecue",
      rating: 4.5,
      address: "Jubilee Hills, Hyderabad",
      url: "#"
    },
    {
      name: "Paradise Seafood",
      category: "Seafood",
      coords: [78.4810, 17.4285],
      cuisine: "Seafood",
      rating: 4.0,
      address: "Begumpet, Hyderabad",
      url: "#"
    },
    {
      name: "Mediterranean Delight",
      category: "Mediterranean",
      coords: [78.4890, 17.4270],
      cuisine: "Mediterranean",
      rating: 4.3,
      address: "Hitech City, Hyderabad",
      url: "#"
    },
    {
      name: "Andhra Spice",
      category: "Andhra",
      coords: [78.4920, 17.4120],
      cuisine: "Andhra",
      rating: 4.4,
      address: "Secunderabad, Hyderabad",
      url: "#"
    },
    {
      name: "Mughlai Mahal",
      category: "Mughlai",
      coords: [78.4780, 17.4180],
      cuisine: "Mughlai",
      rating: 4.2,
      address: "Hussain Sagar, Hyderabad",
      url: "#"
    }
    // Add more restaurants here to make up 15-20 if desired
  ];

  const map = new mapboxgl.Map({
    container: "map",
    style: "mapbox://styles/mapbox/streets-v12",
    center: [78.4867, 17.3850], // Hyderabad center
    zoom: 12,
  });

  let markers = [];

  function clearMarkers() {
    markers.forEach(marker => marker.remove());
    markers = [];
  }

  function addMarkers(category) {
    clearMarkers();

    const filtered = category === "All"
      ? restaurants
      : restaurants.filter(r => r.category === category);

    if(filtered.length === 0) {
      alert("No restaurants found for category: " + category);
    }

    filtered.forEach(r => {
      const popup = new mapboxgl.Popup({ offset: 25 }).setHTML(
        `<h4>${r.name}</h4>
         <p><strong>Cuisine:</strong> ${r.cuisine}</p>
         <p><strong>Rating:</strong> ${r.rating} ⭐</p>
         <p><strong>Address:</strong> ${r.address}</p>
         <a href="${r.url}" target="_blank" rel="noopener noreferrer" style="color:${getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim()}; font-weight:600;">More Info</a>`
      );

      const marker = new mapboxgl.Marker({ color: 'var(--secondary-color)' })
        .setLngLat(r.coords)
        .setPopup(popup)
        .addTo(map);

      markers.push(marker);
    });

    if (filtered.length > 0) {
      map.flyTo({ center: filtered[0].coords, zoom: 13 });
    } else {
      map.flyTo({ center: [78.4867, 17.3850], zoom: 12 });
    }
  }

  // Initial display with all restaurants
  map.on("load", () => {
    addMarkers("All");
  });

  // Categories interaction
  document.querySelectorAll('.category-card').forEach(card => {
    card.addEventListener('click', e => {
      e.preventDefault();
      document.querySelectorAll('.category-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      const category = card.getAttribute('data-category');
      addMarkers(category);
    });
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        card.click();
      }
    });
  });
</script>
</body>
</html>
